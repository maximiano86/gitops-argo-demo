apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-csi
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc 
  project: default
  source:
    repoURL: 'https://github.com/maximiano86/gitops-argo-demo.git'
    targetRevision: HEAD
    path: apps/git/csi-kustomize/overlay/dev
