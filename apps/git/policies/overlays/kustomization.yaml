apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../base/

patchesJSON6902:
  - target:
      version: v1
      kind: Pod
      name: nginx-unprivileged
    patch: |-
      - op: add
        path: /spec/containers/0/securityContext
        value:
            privileged: true